      - name: Locate random source files
        run: |
          echo "==== pwd ===="
          pwd

          echo "==== top level ===="
          ls -la

          echo "==== find all Entity.java ===="
          find . -name "Entity.java" -print || true

          echo "==== find all java files containing SHARED_RANDOM ===="
          grep -RIn --include="*.java" "SHARED_RANDOM" . || true

          echo "==== find all files containing RandomSource random ===="
          grep -RIn --include="*.java" "RandomSource random" . || true

      - name: Patch shared random source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          java_files = list(Path(".").rglob("*.java"))

          print(f"Java files found: {len(java_files)}")

          candidates = []
          for path in java_files:
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue

              if "SHARED_RANDOM" in text or "RandomSource random" in text:
                  candidates.append(path)

          print("Candidate files:")
          for p in candidates:
              print(" -", p)

          patched_any = False

          patterns = [
              (
                  r'((?:public|protected|private)\s+final\s+RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                  r'\1RandomSource.create();'
              ),
              (
                  r'((?:public|protected|private)\s+RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                  r'\1RandomSource.create();'
              ),
              (
                  r'(RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                  r'\1RandomSource.create();'
              ),
          ]

          for path in candidates:
              text = path.read_text(encoding="utf-8", errors="ignore")
              old_text = text

              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)

              if text != old_text:
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched: {path}")
                  patched_any = True
              else:
                  print(f"Not patched, showing related lines: {path}")
                  for i, line in enumerate(old_text.splitlines(), start=1):
                      if "SHARED_RANDOM" in line or "RandomSource random" in line:
                          print(f"{i}: {line}")

          if not patched_any:
              raise SystemExit("Patch failed: no matching random = SHARED_RANDOM line was replaced.")
          PY

      - name: Verify random patch
        run: |
          echo "==== after patch: SHARED_RANDOM ===="
          grep -RIn --include="*.java" "SHARED_RANDOM" . || true

          echo "==== after patch: RandomSource random ===="
          grep -RIn --include="*.java" "RandomSource random" . || true
