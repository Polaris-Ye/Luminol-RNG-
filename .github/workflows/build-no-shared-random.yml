name: Build Luminol without shared random

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global core.autocrlf false
          git config --global core.filemode false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Apply all patches
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./gradlew --refresh-dependencies applyAllPatches

      - name: Locate Entity.java
        run: |
          echo "Searching Entity.java..."
          find . -path "*/src/main/java/net/minecraft/world/entity/Entity.java" -print

      - name: Patch Entity random source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path(".").glob("**/src/main/java/net/minecraft/world/entity/Entity.java"))

          if not candidates:
              raise SystemExit("No Entity.java found.")

          print("Found Entity.java candidates:")
          for p in candidates:
              print(" -", p)

          patched_any = False

          for path in candidates:
              text = path.read_text(encoding="utf-8")
              old_text = text

              # 只处理包含 SHARED_RANDOM 的 Entity.java，避免误改无关文件。
              if "SHARED_RANDOM" not in text:
                  continue

              patterns = [
                  (
                      r'((?:public|protected|private)\s+final\s+RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                      r'\1RandomSource.create();'
                  ),
                  (
                      r'((?:public|protected|private)\s+RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                      r'\1RandomSource.create();'
                  ),
                  (
                      r'(RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
                      r'\1RandomSource.create();'
                  ),
              ]

              for pattern, replacement in patterns:
                  text = re.sub(pattern, replacement, text)

              if text != old_text:
                  path.write_text(text, encoding="utf-8")
                  print(f"Patched: {path}")
                  patched_any = True
              else:
                  print(f"Contains SHARED_RANDOM but pattern not matched: {path}")
                  for i, line in enumerate(old_text.splitlines(), start=1):
                      if "SHARED_RANDOM" in line or "RandomSource random" in line:
                          print(f"{i}: {line}")

          if not patched_any:
              raise SystemExit("Patch failed: no Entity.random = SHARED_RANDOM line was replaced.")
          PY

      - name: Verify patch
        run: |
          echo "==== Entity.java random lines ===="
          for f in $(find . -path "*/src/main/java/net/minecraft/world/entity/Entity.java"); do
            echo "---- $f ----"
            grep -n "RandomSource random" "$f" || true
            grep -n "SHARED_RANDOM" "$f" || true
          done

      - name: Build paperclip jar
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./gradlew createPaperclipJar

      - name: List build outputs
        run: |
          echo "==== build libs ===="
          find . -path "*/build/libs/*.jar" -type f -print

      - name: Upload paperclip jar
        uses: actions/upload-artifact@v4
        with:
          name: luminol-no-shared-random-paperclip
          path: |
            **/build/libs/*paperclip*.jar
            **/build/libs/*.jar
          if-no-files-found: error
