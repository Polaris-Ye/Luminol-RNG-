name: Build Luminol without shared random

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'

      - name: Show Java version
        run: |
          java -version
          javac -version

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Apply all patches
        run: ./gradlew --refresh-dependencies applyAllPatches

      - name: Patch Entity random source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("luminol-server/src/main/java/net/minecraft/world/entity/Entity.java")
          if not path.exists():
              raise SystemExit(f"Entity.java not found: {path}")

          text = path.read_text(encoding="utf-8")

          old_text = text

          # Paper/Folia/Luminol shared random:
          # public final RandomSource random = SHARED_RANDOM;
          # 改回每个实体独立 RandomSource。
          text = re.sub(
              r'((?:public|protected|private)\s+final\s+RandomSource\s+random\s*=\s*)SHARED_RANDOM\s*;',
              r'\1RandomSource.create();',
              text
          )

          if text == old_text:
              print("Did not find direct random = SHARED_RANDOM pattern.")
              print("Searching nearby SHARED_RANDOM lines:")
              for i, line in enumerate(old_text.splitlines(), start=1):
                  if "SHARED_RANDOM" in line or "RandomSource random" in line:
                      print(f"{i}: {line}")
              raise SystemExit("Patch failed: random = SHARED_RANDOM was not replaced.")

          path.write_text(text, encoding="utf-8")
          print("Patched Entity.random: SHARED_RANDOM -> RandomSource.create()")
          PY

      - name: Verify patch
        run: |
          grep -n "RandomSource random" luminol-server/src/main/java/net/minecraft/world/entity/Entity.java || true
          grep -n "SHARED_RANDOM" luminol-server/src/main/java/net/minecraft/world/entity/Entity.java || true

      - name: Build paperclip jar
        run: ./gradlew createPaperclipJar

      - name: List build outputs
        run: |
          find luminol-server/build/libs -type f -maxdepth 1 -print

      - name: Upload paperclip jar
        uses: actions/upload-artifact@v4
        with:
          name: luminol-no-shared-random-paperclip
          path: |
            luminol-server/build/libs/*paperclip*.jar
            luminol-server/build/libs/*.jar
          if-no-files-found: error
